<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title desc">
  <title id="title">Harnis seatbelt</title>
  <desc id="desc">Client speaks stdio JSON-RPC to harnis mcp, which judges tools/call and path-like resources/read before forwarding to the MCP server.</desc>
  <rect width="860" height="260" fill="#f4efe6"/>

  <g stroke="#1c1612" stroke-opacity="0.07" stroke-width="1" fill="none">
    <path d="M30 30 H830 M30 70 H830 M30 110 H830 M30 150 H830 M30 190 H830 M30 230 H830"/>
    <path d="M30 30 V230 M70 30 V230 M110 30 V230 M150 30 V230 M190 30 V230 M230 30 V230 M270 30 V230 M310 30 V230 M350 30 V230 M390 30 V230 M430 30 V230 M470 30 V230 M510 30 V230 M550 30 V230 M590 30 V230 M630 30 V230 M670 30 V230 M710 30 V230 M750 30 V230 M790 30 V230 M830 30 V230"/>
  </g>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#1c1612"/>
    </marker>
  </defs>

  <g fill="none" stroke="#1c1612" stroke-width="1.35">
    <rect x="40" y="88" width="120" height="56"/>
    <rect x="260" y="72" width="200" height="88"/>
    <rect x="580" y="88" width="150" height="56"/>

    <path d="M290 116 H430"/>
    <path d="M360 108 V124"/>

    <path d="M160 116 H260" marker-end="url(#arr)"/>
    <path d="M460 116 H580" marker-end="url(#arr)"/>

    <path d="M360 160 V196 H220" marker-end="url(#arr)"/>
    <rect x="40" y="178" width="180" height="44"/>
  </g>

  <g font-family="Consolas, Monaco, monospace" fill="#1c1612">
    <text x="48" y="28" font-size="11" letter-spacing="1.6">HARNIS / STDIO SEATBELT</text>
    <text x="100" y="122" font-size="13" text-anchor="middle">client</text>
    <text x="360" y="108" font-size="13" text-anchor="middle">harnis mcp</text>
    <text x="360" y="142" font-size="10" text-anchor="middle" fill="#6d6256">judge then forward</text>
    <text x="655" y="122" font-size="13" text-anchor="middle">MCP server</text>
    <text x="130" y="204" font-size="12" text-anchor="middle">deny to client only</text>

    <text x="210" y="78" font-size="10" fill="#6d6256">stdio JSON-RPC</text>
    <text x="500" y="78" font-size="10" fill="#6d6256">stdio (allowed)</text>
    <text x="280" y="214" font-size="10" fill="#9d1c1c">blocked - never reaches child</text>
  </g>

  <g stroke="#1c1612" stroke-width="1" fill="none">
    <path d="M40 88 h7 M40 88 v7"/>
    <path d="M160 88 h-7 M160 88 v7"/>
    <path d="M40 144 h7 M40 144 v-7"/>
    <path d="M160 144 h-7 M160 144 v-7"/>
  </g>
</svg>
