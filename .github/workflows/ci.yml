name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q
      - name: Init smoke
        shell: bash
        run: |
          root=$(mktemp -d)
          mkdir -p "$root/.cursor"
          printf '%s\n' '{"mcpServers":{"github":{"command":"github-mcp-server","args":["stdio"]}}}' > "$root/.cursor/mcp.json"
          cd "$root"
          python -m harnis init
          python -m harnis status

  ptrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Ptrace smoke
        run: python scripts/wsl_ptrace_smoke.py
      - name: Ptrace pytest
        run: python -m pytest tests/test_ptrace_linux.py -q
