name: publish-npm

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish with trusted publishing or NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ] && [ "$NODE_AUTH_TOKEN" != "XXXXX-XXXXX-XXXXX-XXXXX" ]; then
            npm publish --access public
          else
            unset NODE_AUTH_TOKEN
            npm publish --access public --provenance
          fi
