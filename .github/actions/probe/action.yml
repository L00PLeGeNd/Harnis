name: Harnis probe
description: Fail the job when a local agent proposes a tool call Harnis would block
inputs:
  agent:
    description: Script that exports build_agent()
    required: true
  scenario:
    description: Comma list of credential, destructive, rag, escalation, exfil, all
    required: false
    default: credential,destructive
  report:
    description: HTML report path
    required: false
    default: harnis-probe.html
runs:
  using: composite
  steps:
    - name: Install Harnis
      shell: bash
      run: python -m pip install "harnis @ git+https://github.com/L00PLeGeNd/Harnis.git"
    - name: Probe the agent
      shell: bash
      run: python -m harnis probe --scenario "${{ inputs.scenario }}" --report "${{ inputs.report }}" -- ${{ inputs.agent }}
    - name: Upload the probe report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: harnis-probe
        path: ${{ inputs.report }}
