[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnis"
version = "0.3.0"
description = "MCP proxy that blocks dangerous tool calls before they reach the server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["agent", "sandbox", "security", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
harnis = "harnis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
