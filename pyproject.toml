[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnis"
version = "0.7.1"
description = "Stdio proxy and project init that wrap MCP servers and block dangerous agent tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "agent", "security", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
harnis = "harnis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
